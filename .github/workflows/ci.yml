name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2' }
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit
  core-is-shared:
    # src/Core must stay identical on 1.x and 2.x, and free of Craft and Yii.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: "! grep -rEn '^\\s*use\\s+(craft|yii)\\\\|\\bCraft::|yii\\\\' src/Core"
      - run: |
          other=$([ "$GITHUB_REF_NAME" = "2.x" ] && echo 1.x || echo 2.x)
          if git rev-parse --verify "origin/$other" >/dev/null 2>&1; then git diff --exit-code "origin/$other" -- src/Core; fi
  latest-craft:
    # T40: the login button hangs on this hook, so a new Craft release that drops it must fail here.
    runs-on: ubuntu-latest
    steps:
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2' }
      - run: composer create-project craftcms/craft /tmp/craft --no-install --no-scripts --no-interaction
      - run: cd /tmp/craft && composer update craftcms/cms --no-install --no-scripts --no-interaction
      - run: cd /tmp/craft && composer install --no-scripts --no-interaction
      - run: grep -q "cp.login.alternative-login-methods" /tmp/craft/vendor/craftcms/cms/src/templates/_special/login.twig
