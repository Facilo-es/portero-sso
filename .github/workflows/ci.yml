name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.5' }
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit
  core-is-shared:
    # src/Core must stay identical on 1.x and 2.x, and free of Craft and Yii.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: "! grep -rEn '^\\s*use\\s+(craft|yii)\\\\|\\bCraft::|yii\\\\' src/Core"
      - run: |
          other=$([ "$GITHUB_REF_NAME" = "2.x" ] && echo 1.x || echo 2.x)
          if git rev-parse --verify "origin/$other" >/dev/null 2>&1; then git diff --exit-code "origin/$other" -- src/Core; fi
  latest-craft:
    # T40 on Craft 6: the login buttons hang on Craft's OAuth button list and the template hook, so a new Craft 6 release that drops either must fail here.
    runs-on: ubuntu-latest
    steps:
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.5' }
      - run: composer create-project "craftcms/craft:^6.0@alpha" /tmp/craft --stability=alpha --no-install --no-scripts --no-interaction
      - run: cd /tmp/craft && composer config allow-plugins.yiisoft/yii2-composer true && composer update --no-scripts --no-interaction
      - run: grep -q "function getLoginButtons" /tmp/craft/vendor/craftcms/cms/src/Auth/OAuth/OAuth.php
      - run: grep -rq "cp.login.alternative-login-methods" /tmp/craft/vendor/craftcms/cms/resources/templates /tmp/craft/vendor/craftcms/cms/src 2>/dev/null
